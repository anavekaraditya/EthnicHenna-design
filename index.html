    <script>
      // Show the preloader once per session, and never on the queue or admin tools.
      try { if (sessionStorage.getItem('eh-preloaded') || /^\/(queue|admin)/.test(location.pathname)) document.documentElement.classList.add('no-preload') } catch (e) {}
    </script>
    <style>
      #preloader { align-items: center; background: oklch(97% .018 55); display: flex; flex-direction: column; gap: 22px; inset: 0; justify-content: center; position: fixed; transition: opacity .6s ease, visibility .6s ease; z-index: 1000; }
      #preloader.is-done { opacity: 0; pointer-events: none; visibility: hidden; }
      .no-preload #preloader { display: none; }
      #preloader svg { height: 148px; overflow: visible; width: 148px; }
      #preloader .pl-spin { animation: pl-spin 14s linear infinite; transform-origin: 60px 60px; }
      #preloader .pl-bloom { animation: pl-breathe 2.4s ease-in-out infinite; transform-origin: 60px 60px; }
      #preloader .pl-draw { animation: pl-draw 1.5s cubic-bezier(.16, 1, .3, 1) forwards; fill: none; stroke: oklch(61% .12 31); stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.6; stroke-dasharray: 100; stroke-dashoffset: 100; }
      #preloader .pl-petal:nth-child(2) .pl-draw { animation-delay: .1s } #preloader .pl-petal:nth-child(3) .pl-draw { animation-delay: .2s } #preloader .pl-petal:nth-child(4) .pl-draw { animation-delay: .3s }
      #preloader .pl-petal:nth-child(5) .pl-draw { animation-delay: .4s } #preloader .pl-petal:nth-child(6) .pl-draw { animation-delay: .5s } #preloader .pl-petal:nth-child(7) .pl-draw { animation-delay: .6s } #preloader .pl-petal:nth-child(8) .pl-draw { animation-delay: .7s }
      #preloader .pl-ring { fill: none; stroke: oklch(78% .04 35); stroke-width: 1; }
      #preloader .pl-dot { animation: pl-pop .5s cubic-bezier(.16, 1, .3, 1) both; fill: oklch(38% .095 28); }
      #preloader .pl-core { fill: oklch(38% .095 28); }
      #preloader .pl-name { color: oklch(38% .095 28); font-family: 'Aujournuit', 'Times New Roman', serif; font-size: 1.5rem; letter-spacing: -.01em; margin: 0; }
      #preloader .pl-dots { display: flex; gap: 7px; }
      #preloader .pl-dots i { animation: pl-bounce 1.1s ease-in-out infinite; background: oklch(61% .12 31); border-radius: 50%; display: block; height: 6px; width: 6px; }
      #preloader .pl-dots i:nth-child(2) { animation-delay: .15s } #preloader .pl-dots i:nth-child(3) { animation-delay: .3s }
      @keyframes pl-draw { to { stroke-dashoffset: 0 } }
      @keyframes pl-spin { to { transform: rotate(360deg) } }
      @keyframes pl-breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
      @keyframes pl-pop { from { opacity: 0; transform: scale(0) } to { opacity: 1; transform: scale(1) } }
      @keyframes pl-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5 } 30% { transform: translateY(-7px); opacity: 1 } }
      body.is-preloading { overflow: hidden; }
      @media (prefers-reduced-motion: reduce) { #preloader .pl-spin, #preloader .pl-bloom, #preloader .pl-dots i { animation: none } #preloader .pl-draw { animation-duration: .01s; animation-delay: 0s !important } }
    </style>

  <body>

      <svg viewBox="0 0 120 120" aria-hidden="true"><g class="pl-spin"><circle class="pl-ring" cx="60" cy="60" r="53"/><circle class="pl-dot" style="animation-delay:0.90s" cx="60.0" cy="7.0" r="2"/><circle class="pl-dot" style="animation-delay:0.95s" cx="80.3" cy="11.0" r="1.2"/><circle class="pl-dot" style="animation-delay:1.00s" cx="97.5" cy="22.5" r="2"/><circle class="pl-dot" style="animation-delay:1.05s" cx="109.0" cy="39.7" r="1.2"/><circle class="pl-dot" style="animation-delay:1.10s" cx="113.0" cy="60.0" r="2"/><circle class="pl-dot" style="animation-delay:1.15s" cx="109.0" cy="80.3" r="1.2"/><circle class="pl-dot" style="animation-delay:1.20s" cx="97.5" cy="97.5" r="2"/><circle class="pl-dot" style="animation-delay:1.25s" cx="80.3" cy="109.0" r="1.2"/><circle class="pl-dot" style="animation-delay:1.30s" cx="60.0" cy="113.0" r="2"/><circle class="pl-dot" style="animation-delay:1.35s" cx="39.7" cy="109.0" r="1.2"/><circle class="pl-dot" style="animation-delay:1.40s" cx="22.5" cy="97.5" r="2"/><circle class="pl-dot" style="animation-delay:1.45s" cx="11.0" cy="80.3" r="1.2"/><circle class="pl-dot" style="animation-delay:1.50s" cx="7.0" cy="60.0" r="2"/><circle class="pl-dot" style="animation-delay:1.55s" cx="11.0" cy="39.7" r="1.2"/><circle class="pl-dot" style="animation-delay:1.60s" cx="22.5" cy="22.5" r="2"/><circle class="pl-dot" style="animation-delay:1.65s" cx="39.7" cy="11.0" r="1.2"/></g><g class="pl-bloom"><g class="pl-petal" transform="rotate(0 60 60)"><path class="pl-draw" pathLength="100" d="M60 44 C52 33 52 21 60 12 C68 21 68 33 60 44Z"/></g><g class="pl-petal" transform="rotate(45 60 60)"><path class="pl-draw" pathLength="100" d="M60 44 C52 33 52 21 60 12 C68 21 68 33 60 44Z"/></g><g class="pl-petal" transform="rotate(90 60 60)"><path class="pl-draw" pathLength="100" d="M60 44 C52 33 52 21 60 12 C68 21 68 33 60 44Z"/></g><g class="pl-petal" transform="rotate(135 60 60)"><path class="pl-draw" pathLength="100" d="M60 44 C52 33 52 21 60 12 C68 21 68 33 60 44Z"/></g><g class="pl-petal" transform="rotate(180 60 60)"><path class="pl-draw" pathLength="100" d="M60 44 C52 33 52 21 60 12 C68 21 68 33 60 44Z"/></g><g class="pl-petal" transform="rotate(225 60 60)"><path class="pl-draw" pathLength="100" d="M60 44 C52 33 52 21 60 12 C68 21 68 33 60 44Z"/></g><g class="pl-petal" transform="rotate(270 60 60)"><path class="pl-draw" pathLength="100" d="M60 44 C52 33 52 21 60 12 C68 21 68 33 60 44Z"/></g><g class="pl-petal" transform="rotate(315 60 60)"><path class="pl-draw" pathLength="100" d="M60 44 C52 33 52 21 60 12 C68 21 68 33 60 44Z"/></g><circle class="pl-core" cx="60" cy="60" r="5"/></g></svg>

    <script>
      (function () {
        var el = document.getElementById('preloader')
        if (!el || document.documentElement.classList.contains('no-preload')) return
        var start = Date.now(), minMs = 1600, closed = false
        document.body.classList.add('is-preloading')
        function close() {
          if (closed) return
          closed = true
          el.classList.add('is-done')
          document.body.classList.remove('is-preloading')
          try { sessionStorage.setItem('eh-preloaded', '1') } catch (e) {}
          setTimeout(function () { el.remove() }, 800)
        }
        function ready() { setTimeout(close, Math.max(0, minMs - (Date.now() - start))) }
        if (document.readyState === 'complete') ready(); else window.addEventListener('load', ready)
        setTimeout(close, 5000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
